name: Controllo Bandi Fisica UniBo

on:
  schedule:
    # Mattina alle 05:20 UTC (07:20 ora italiana estiva CEST / 06:20 ora solare CET).
    # Il minuto non congestionato (:20 anziché :00) evita le code di GitHub Actions
    # assicurando la consegna della notifica e dell'email sempre prima delle 08:00.
    - cron: '20 5 * * *'
  workflow_dispatch: # Permette di avviarlo manualmente dalla scheda Actions con 1 click

permissions:
  contents: write  # Per salvare storico e tabelle aggiornate
  issues: write    # Per creare e aggiornare la notifica via Issue

jobs:
  track-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esecuzione Monitoraggio Bandi e Notifiche
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python bandi.py

      - name: Salva storico e tabelle aggiornate nel repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bandi_trovati.json data/bandi_memoria.json bandi_attivi.csv bandi_attivi.html bandi_attivi.md bandi_in_scadenza.md
          if git diff --staged --quiet; then
            echo "Nessun cambiamento nei file tracciati."
          else
            git commit -m "Aggiornamento bandi e tabelle [skip ci]"
            git push
          fi

      - name: Carica tabelle scaricabili (GitHub Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: bandi-fisica-tabelle
          retention-days: 14
          path: |
            bandi_attivi.csv
            bandi_attivi.html
            bandi_attivi.md
            bandi_in_scadenza.md
