name: Controllo Bandi Fisica UniBo

on:
  schedule:
    # Notifica unica giornaliera su Telegram verso le 07:35 ora italiana.
    # Due cron (05:35 e 06:35 UTC) coprono ora legale e solare: lo script esegue
    # il controllo solo se a Roma sono già le 07:00 e non l'ha già fatto oggi.
    - cron: '35 5 * * *'
    - cron: '35 6 * * *'
  workflow_dispatch:
    inputs:
      forza_invio:
        description: 'Invia il riepilogo Telegram anche se non ci sono novità'
        type: boolean
        default: false

permissions:
  contents: write  # Per salvare storico e tabelle aggiornate

jobs:
  track-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Monitoraggio bandi e notifica Telegram
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          FORCE_SEND: ${{ inputs.forza_invio }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bandi.py

      - name: Salva storico e tabelle aggiornate nel repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bandi_trovati.json data/ bandi_attivi.csv bandi_attivi.html bandi_attivi.md bandi_in_scadenza.md
          if git diff --staged --quiet; then
            echo "Nessun cambiamento nei file tracciati."
          else
            git commit -m "Aggiornamento bandi e tabelle [skip ci]"
            git push
          fi

      - name: Avviso Telegram in caso di errore
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "text=⚠️ <b>Bot bandi: esecuzione fallita</b>
          <a href=\"${RUN_URL}\">Apri il log su GitHub</a>" > /dev/null
          fi
